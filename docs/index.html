<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SadOne Journal</title>
<style>
@font-face{font-family:Caveat;src:url(fonts/caveat-500.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat-700.woff2) format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;padding:34px 16px 60px;background:#faf7f2;
background-image:radial-gradient(#e7e2d6 1px,transparent 1px);background-size:24px 24px;
font-family:Caveat,'Segoe Print','Bradley Hand','楷体','Kaiti SC',cursive;color:#3b3a37;text-align:center}
.wrap{max-width:600px;margin:0 auto}
.top{font-size:15px;color:#a5a199;text-align:right;max-width:600px;margin:0 auto 30px}
.top a{color:#a5a199;text-decoration:none;margin-left:16px}
.top a:hover{color:#3b3a37}
.hero img{width:190px;display:block;margin:0 auto 0}
.cat-wreath{position:relative;width:170px;height:170px;margin:0 auto 8px}
.cat-wreath .wr{position:absolute;inset:0;width:100%;height:100%}
.cat-wreath .cat{position:absolute;width:72%;height:72%;left:14%;top:14%;border-radius:50%}
.hero h1{font-size:40px;margin:0 0 2px;letter-spacing:.03em}
.hero p{font-size:17px;color:#8a8880;margin:2px 0 0}
.doodle{width:30px;vertical-align:-6px;margin:0 3px}
.hr{width:190px;margin:30px auto;display:block}
h2.sec{font-size:26px;margin:36px 0 16px;color:#3b3a37}
.posts{text-align:left;max-width:520px;margin:0 auto}
.post{display:block;text-decoration:none;color:#3b3a37;padding:13px 6px;border-bottom:1.5px dashed #d8d3c8}
.post:hover{background:#fdf9f0}
.post .d{font-size:14px;color:#a5a199;letter-spacing:.12em}
.post .t{font-size:21px;font-weight:700}
.post .t .ic{width:22px;vertical-align:-4px;margin-left:6px}
.post.todo .t{color:#a5a199;font-weight:400}
.side{margin:34px auto 0;max-width:520px;display:flex;align-items:center;justify-content:center;gap:16px}
.side img.r{width:150px}
.side img.d{width:34px}
.side p{text-align:left;font-size:17px;color:#8a8880;line-height:1.6;margin:0}
footer{margin-top:44px;font-size:15px;color:#a5a199}
footer img{width:150px;display:block;margin:0 auto 6px}
footer a{color:#8a8880;text-decoration:none;border-bottom:1px dashed #c9c4b8}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="gallery.html">贴纸</a><a href="https://github.com/gguioo/sadone" target="_blank" rel="noopener">GitHub</a></div>

  <div class="hero">
    <div class="cat-wreath">
      <img class="wr" src="img/wreath-big.png" alt="花环">
      <img class="cat" src="img/cat-round.png" alt="猫猫">
    </div>
    <img src="stickers/ribbon/ribbon_003.png" alt="Title">
    <h1>SadOne Journal</h1>
    <p>一本贴着手账贴纸的博客</p>
  </div>

  <img class="hr" src="stickers/divider/divider_004.png" alt="">

  <h2 class="sec">文章</h2>
  <div class="posts">
    <a class="post" href="article-01.html">
      <div class="d">2026 · 09 · 29</div>
      <div class="t">打开手账：234 枚贴纸，全部摊开<img class="ic" src="stickers/doodle/doodle_004.png" alt=""></div>
    </a>
    <div class="post todo">
      <div class="d">某 一 天</div>
      <div class="t">下一篇，想到再写</div>
    </div>
    <div class="post todo">
      <div class="d">又 一 天</div>
      <div class="t">大概是天气好的时候</div>
    </div>
  </div>

  <div class="side">
    <img class="r" src="stickers/ribbon/ribbon_009.png" alt="Good Day">
    <p>今天的风很温柔。<br>贴纸已经贴好了，<br>就等你来翻。</p>
    <img class="d" src="stickers/doodle/doodle_006.png" alt="">
  </div>

  <footer>
    <img src="stickers/divider/divider_004.png" alt="">
    SadOne · <a href="gallery.html">贴纸 234 枚</a> · <a href="https://github.com/gguioo/sadone" target="_blank" rel="noopener">GitHub</a> · 全部原图抠切
  </footer>
</div>
</body>
</html>
