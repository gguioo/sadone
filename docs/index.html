<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SadOne Journal · 手账博客</title>
<style>
@font-face{font-family:Caveat;src:url(fonts/caveat-500.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat-700.woff2) format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;padding:30px 16px 60px;background:#faf7f2;
background-image:radial-gradient(#e5e0d5 1px,transparent 1px);background-size:22px 22px;
font-family:Caveat,'Segoe Print','Bradley Hand','楷体','Kaiti SC',cursive;color:#3b3a37;text-align:center}
nav{margin-bottom:8px}
nav a{color:#8a8880;text-decoration:none;font-size:19px;margin:0 14px}
nav a:hover{color:#3b3a37;text-decoration:underline wavy}
.hero img.ribbon{width:340px;display:block;margin:0 auto}
.hero h1{font-size:52px;margin:2px 0 0;letter-spacing:.04em}
.hero .sub{font-size:20px;color:#8a8880;margin:4px 0 0}
.hero .tape{position:absolute;width:90px;transform:rotate(-6deg);opacity:.95}
.hero{position:relative;max-width:760px;margin:0 auto;padding-top:6px}
.hero .tape.l{left:6%;top:30px}
.hero .tape.r{right:6%;top:110px;transform:rotate(7deg)}
section.recent{max-width:820px;margin:44px auto 10px}
.sec-ribbon{width:250px;display:block;margin:0 auto 20px}
.paper-link{display:inline-block;background:#fffdf8;border:1.8px dashed #3b3a37;border-radius:12px;padding:16px 26px 12px;margin:10px 12px;min-width:250px}
.paper-link .paper-date{font-size:14px;color:#8a8880;letter-spacing:.1em;margin-bottom:4px}
.paper-link a{font-size:22px;font-weight:700;color:#3b3a37;text-decoration:none}
.paper-link a:hover{text-decoration:underline wavy}
.note-body{position:absolute;left:10%;right:10%;top:31%;text-align:left;font-size:17px;line-height:1.9}
.note-body a{color:#3b3a37;text-decoration:none;border-bottom:1.5px dashed #b9b5aa}
.note-body a:hover{color:#e88b7d;border-color:#e88b7d}
.note-date{font-size:13px;color:#a5a199}
.scatter{max-width:860px;margin:34px auto 8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:8px}
.scatter img{width:110px}
.scatter img:nth-child(3n){transform:rotate(6deg)}
.scatter img:nth-child(3n+1){transform:rotate(-5deg)}
.scatter img:nth-child(3n+2){transform:rotate(2deg)}
.divider{width:270px;display:block;margin:30px auto}
footer{margin-top:46px;font-size:16px;color:#a5a199}
footer a{color:#8a8880}
</style>
</head>
