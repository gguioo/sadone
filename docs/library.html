const CAT_CN = {}; DATA.forEach(d => CAT_CN[d.c] = d.cn);
const nav = document.getElementById('nav'), main = document.getElementById('main');
order.forEach(c => {

  });
  sec.appendChild(grid); main.appendChild(sec);
});
